<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(248 46% 34%)"/>
      <stop offset="58%" stop-color="hsl(318 40% 50%)"/>
      <stop offset="100%" stop-color="hsl(24 70% 64%)"/>
