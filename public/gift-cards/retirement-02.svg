<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Happy Retirement gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(0 0% 100%)"/>
      <stop offset="100%" stop-color="hsl(32 66% 90%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><circle cx="320" cy="176" r="62" fill="hsl(20 78% 56%)" opacity="0.9"/><rect x="112" y="202" width="343" height="5" rx="3" fill="hsl(68 84% 58%)" opacity="0.50"/><rect x="95" y="218" width="399" height="5" rx="3" fill="hsl(68 84% 58%)" opacity="0.43"/><rect x="115" y="234" width="416" height="5" rx="3" fill="hsl(68 84% 58%)" opacity="0.36"/><rect x="106" y="250" width="388" height="5" rx="3" fill="hsl(68 84% 58%)" opacity="0.29"/><rect x="98" y="266" width="360" height="5" rx="3" fill="hsl(68 84% 58%)" opacity="0.22"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(20 78% 56%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="hsl(26 58% 28%)">Happy Retirement</text>
</svg>
