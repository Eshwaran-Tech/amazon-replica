      <ellipse cx="60" cy="75" rx="6" ry="8" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M178 162 q -6 60 -4 110" fill="none" stroke="hsl(0 0% 100%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="178" cy="139" rx="24" ry="29" fill="hsl(160 70% 70%)"/>
      <ellipse cx="170" cy="130" rx="6" ry="7" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M260 167 q -6 60 -3 110" fill="none" stroke="hsl(0 0% 100%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="260" cy="133" rx="34" ry="40" fill="hsl(16 92% 68%)"/>
      <ellipse cx="249" cy="122" rx="8" ry="10" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M371 141 q -3 60 -1 110" fill="none" stroke="hsl(0 0% 100%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="371" cy="118" rx="23" ry="27" fill="hsl(160 70% 70%)"/>
      <ellipse cx="364" cy="110" rx="5" ry="7" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M469 144 q -5 60 1 110" fill="none" stroke="hsl(0 0% 100%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="469" cy="116" rx="28" ry="33" fill="hsl(16 92% 68%)"/>
      <ellipse cx="460" cy="106" rx="7" ry="8" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M565 158 q 5 60 -3 110" fill="none" stroke="hsl(0 0% 100%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="565" cy="135" rx="23" ry="27" fill="hsl(160 70% 70%)"/>
