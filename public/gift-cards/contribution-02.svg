<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Thank You gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(0 0% 100%)"/>
      <stop offset="100%" stop-color="hsl(297 66% 90%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><rect x="126" y="172" width="38" height="34" rx="5" fill="hsl(333 84% 58%)" opacity="0.45"/><rect x="184" y="146" width="38" height="60" rx="5" fill="hsl(333 84% 58%)" opacity="0.56"/><rect x="242" y="120" width="38" height="86" rx="5" fill="hsl(333 84% 58%)" opacity="0.67"/><rect x="300" y="94" width="38" height="112" rx="5" fill="hsl(333 84% 58%)" opacity="0.78"/><rect x="358" y="68" width="38" height="138" rx="5" fill="hsl(333 84% 58%)" opacity="0.89"/>
  <path d="M120 176 L378 74" fill="none" stroke="hsl(285 78% 56%)" stroke-width="7" stroke-linecap="round"/>
  <path d="M378 74 l -32 4 l 18 26 Z" fill="hsl(285 78% 56%)" transform="rotate(0.5 378 74)"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(285 78% 56%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(291 58% 28%)">Thank You</text>
</svg>
