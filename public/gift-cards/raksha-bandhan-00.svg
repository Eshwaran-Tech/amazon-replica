<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Happy Raksha Bandhan gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(345 82% 92%)"/>
      <stop offset="100%" stop-color="hsl(13 76% 82%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><path d="M40 134 q 80 -34 160 0 t 160 0 t 160 0" fill="none" stroke="hsl(345 74% 52%)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="46" cy="134" r="7" fill="hsl(175 62% 46%)"/><circle cx="86" cy="145" r="5" fill="hsl(175 62% 46%)"/><circle cx="126" cy="150" r="8" fill="hsl(175 62% 46%)"/><circle cx="166" cy="145" r="5" fill="hsl(175 62% 46%)"/><circle cx="206" cy="133" r="7" fill="hsl(175 62% 46%)"/><circle cx="246" cy="122" r="8" fill="hsl(175 62% 46%)"/><circle cx="286" cy="118" r="6" fill="hsl(175 62% 46%)"/><circle cx="326" cy="124" r="8" fill="hsl(175 62% 46%)"/><circle cx="366" cy="136" r="7" fill="hsl(175 62% 46%)"/><circle cx="406" cy="147" r="7" fill="hsl(175 62% 46%)"/><circle cx="446" cy="150" r="8" fill="hsl(175 62% 46%)"/><circle cx="486" cy="143" r="7" fill="hsl(175 62% 46%)"/><circle cx="526" cy="131" r="7" fill="hsl(175 62% 46%)"/><circle cx="566" cy="121" r="8" fill="hsl(175 62% 46%)"/>
  <circle cx="320" cy="130" r="30" fill="hsl(345 74% 52%)"/>
  <circle cx="320" cy="130" r="15" fill="hsl(175 62% 46%)"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(345 74% 52%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="hsl(345 62% 24%)">Happy Raksha Bandhan</text>
</svg>
