<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Just because gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(30 62% 88%)"/>
      <stop offset="100%" stop-color="hsl(190 70% 84%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><circle cx="101" cy="164" r="53" fill="hsl(190 72% 50%)" opacity="0.42"/><circle cx="181" cy="113" r="36" fill="hsl(40 62% 48%)" opacity="0.42"/><circle cx="244" cy="152" r="46" fill="hsl(190 72% 50%)" opacity="0.42"/><circle cx="324" cy="124" r="54" fill="hsl(40 62% 48%)" opacity="0.42"/><circle cx="403" cy="157" r="35" fill="hsl(190 72% 50%)" opacity="0.42"/><circle cx="488" cy="163" r="34" fill="hsl(40 62% 48%)" opacity="0.42"/><circle cx="557" cy="112" r="32" fill="hsl(190 72% 50%)" opacity="0.42"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(190 72% 50%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(40 52% 26%)">Just because</text>
</svg>
