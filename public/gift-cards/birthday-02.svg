      <ellipse cx="158" cy="119" rx="7" ry="9" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M269 186 q -3 60 -1 110" fill="none" stroke="hsl(346 58% 28%)" stroke-opacity="0.35" stroke-width="2"/>
