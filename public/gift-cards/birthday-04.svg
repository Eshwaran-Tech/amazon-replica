      <ellipse cx="347" cy="148" rx="6" ry="8" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M465 117 q -5 60 -1 110" fill="none" stroke="hsl(0 0% 100%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="465" cy="84" rx="33" ry="40" fill="hsl(24 94% 70%)"/>
      <ellipse cx="455" cy="73" rx="8" ry="10" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M556 140 q -2 60 -6 110" fill="none" stroke="hsl(0 0% 100%)" stroke-opacity="0.35" stroke-width="2"/>
