      <ellipse cx="68" cy="107" rx="6" ry="8" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M156 159 q 1 60 -1 110" fill="none" stroke="hsl(0 0% 100%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="156" cy="136" rx="23" ry="28" fill="hsl(340 74% 66%)"/>
      <ellipse cx="149" cy="128" rx="6" ry="7" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M253 153 q 3 60 2 110" fill="none" stroke="hsl(0 0% 100%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="253" cy="120" rx="33" ry="39" fill="hsl(24 94% 70%)"/>
      <ellipse cx="244" cy="108" rx="8" ry="10" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
