<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Happy Diwali gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(35 58% 34%)"/>
      <stop offset="100%" stop-color="hsl(3 62% 20%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><path d="M116 150 q 52 46 104 0 Z" fill="hsl(71 92% 68%)"/>
    <ellipse cx="168" cy="150" rx="52" ry="12" fill="hsl(215 70% 70%)"/>
    <path d="M168 144 q -6 -30 0 -44 q 6 14 0 44 Z" fill="hsl(42 96% 62%)"/>
    <circle cx="168" cy="116" r="16" fill="hsl(42 96% 68%)" opacity="0.3"/><path d="M268 132 q 52 46 104 0 Z" fill="hsl(71 92% 68%)"/>
    <ellipse cx="320" cy="132" rx="52" ry="12" fill="hsl(215 70% 70%)"/>
    <path d="M320 126 q -6 -30 0 -44 q 6 14 0 44 Z" fill="hsl(42 96% 62%)"/>
    <circle cx="320" cy="98" r="18" fill="hsl(42 96% 68%)" opacity="0.3"/><path d="M420 150 q 52 46 104 0 Z" fill="hsl(71 92% 68%)"/>
    <ellipse cx="472" cy="150" rx="52" ry="12" fill="hsl(215 70% 70%)"/>
    <path d="M472 144 q -6 -30 0 -44 q 6 14 0 44 Z" fill="hsl(42 96% 62%)"/>
    <circle cx="472" cy="116" r="18" fill="hsl(42 96% 68%)" opacity="0.3"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(0,0,0,0.34)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(71 92% 68%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(0 0% 100%)">Happy Diwali</text>
</svg>
