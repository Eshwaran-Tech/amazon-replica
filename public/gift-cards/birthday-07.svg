      <ellipse cx="148" cy="66" rx="7" ry="9" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M252 124 q -1 60 -6 110" fill="none" stroke="hsl(346 58% 28%)" stroke-opacity="0.35" stroke-width="2"/>
