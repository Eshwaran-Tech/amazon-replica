<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Welcome Home gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(230 62% 88%)"/>
      <stop offset="100%" stop-color="hsl(30 70% 84%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><path d="M234 150 L320 80 L406 150 Z" fill="hsl(30 72% 50%)"/>
  <rect x="254" y="150" width="132" height="86" rx="6" fill="hsl(240 62% 48%)"/>
  <rect x="302" y="190" width="36" height="46" rx="4" fill="hsl(240 52% 26%)" opacity="0.75"/>
  <rect x="268" y="166" width="26" height="26" rx="3" fill="#ffffff" opacity="0.7"/>
  <rect x="346" y="166" width="26" height="26" rx="3" fill="#ffffff" opacity="0.7"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(30 72% 50%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(240 52% 26%)">Welcome Home</text>
</svg>
