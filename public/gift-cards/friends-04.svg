<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Just because gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(190 46% 16%)"/>
      <stop offset="100%" stop-color="hsl(218 54% 30%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><circle cx="99" cy="155" r="43" fill="hsl(234 94% 70%)" opacity="0.42"/><circle cx="180" cy="126" r="52" fill="hsl(190 74% 66%)" opacity="0.42"/><circle cx="257" cy="169" r="41" fill="hsl(234 94% 70%)" opacity="0.42"/><circle cx="321" cy="168" r="37" fill="hsl(190 74% 66%)" opacity="0.42"/><circle cx="400" cy="139" r="52" fill="hsl(234 94% 70%)" opacity="0.42"/><circle cx="479" cy="157" r="42" fill="hsl(190 74% 66%)" opacity="0.42"/><circle cx="563" cy="165" r="35" fill="hsl(234 94% 70%)" opacity="0.42"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(0,0,0,0.34)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(234 94% 70%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(0 0% 100%)">Just because</text>
</svg>
