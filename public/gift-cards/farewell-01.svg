<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Time to say goodbye gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(200 58% 34%)"/>
      <stop offset="100%" stop-color="hsl(168 62% 20%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><circle cx="320" cy="176" r="62" fill="hsl(236 92% 68%)" opacity="0.9"/><rect x="121" y="202" width="394" height="5" rx="3" fill="hsl(20 70% 70%)" opacity="0.50"/><rect x="123" y="218" width="348" height="5" rx="3" fill="hsl(20 70% 70%)" opacity="0.43"/><rect x="109" y="234" width="384" height="5" rx="3" fill="hsl(20 70% 70%)" opacity="0.36"/><rect x="124" y="250" width="380" height="5" rx="3" fill="hsl(20 70% 70%)" opacity="0.29"/><rect x="100" y="266" width="365" height="5" rx="3" fill="hsl(20 70% 70%)" opacity="0.22"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(0,0,0,0.34)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(236 92% 68%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="hsl(0 0% 100%)">Time to say goodbye</text>
</svg>
