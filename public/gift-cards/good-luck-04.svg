<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Good Luck gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(140 46% 16%)"/>
      <stop offset="100%" stop-color="hsl(168 54% 30%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><path transform="translate(341.2 133.2) scale(1.375)" d="M0 10 C -14 -6 -26 4 -16 16 L0 32 L16 16 C 26 4 14 -6 0 10 Z" fill="hsl(184 94% 70%)" opacity="0.92"/><path transform="translate(298.8 133.2) scale(1.375)" d="M0 10 C -14 -6 -26 4 -16 16 L0 32 L16 16 C 26 4 14 -6 0 10 Z" fill="hsl(184 94% 70%)" opacity="0.92"/><path transform="translate(298.8 90.8) scale(1.375)" d="M0 10 C -14 -6 -26 4 -16 16 L0 32 L16 16 C 26 4 14 -6 0 10 Z" fill="hsl(184 94% 70%)" opacity="0.92"/><path transform="translate(341.2 90.8) scale(1.375)" d="M0 10 C -14 -6 -26 4 -16 16 L0 32 L16 16 C 26 4 14 -6 0 10 Z" fill="hsl(184 94% 70%)" opacity="0.92"/><path d="M320 162 q 8 42 -14 66" fill="none" stroke="hsl(184 94% 70%)" stroke-width="6" stroke-linecap="round"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(0,0,0,0.34)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(184 94% 70%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(0 0% 100%)">Good Luck</text>
</svg>
