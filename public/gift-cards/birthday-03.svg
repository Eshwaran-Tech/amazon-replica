      <ellipse cx="72" cy="133" rx="7" ry="9" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M171 186 q -6 60 -4 110" fill="none" stroke="hsl(190 52% 26%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="171" cy="156" rx="29" ry="35" fill="hsl(190 62% 48%)"/>
      <ellipse cx="162" cy="146" rx="7" ry="9" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M254 178 q 5 60 0 110" fill="none" stroke="hsl(190 52% 26%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="254" cy="149" rx="29" ry="34" fill="hsl(340 72% 50%)"/>
      <ellipse cx="245" cy="139" rx="7" ry="9" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M354 171 q -5 60 -0 110" fill="none" stroke="hsl(190 52% 26%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="354" cy="141" rx="30" ry="37" fill="hsl(190 62% 48%)"/>
      <ellipse cx="344" cy="130" rx="7" ry="9" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M449 133 q -1 60 1 110" fill="none" stroke="hsl(190 52% 26%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="449" cy="105" rx="28" ry="34" fill="hsl(340 72% 50%)"/>
      <ellipse cx="441" cy="96" rx="7" ry="8" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M554 146 q -5 60 -4 110" fill="none" stroke="hsl(190 52% 26%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="554" cy="123" rx="23" ry="28" fill="hsl(190 62% 48%)"/>
      <ellipse cx="547" cy="115" rx="6" ry="7" fill="#ffffff" opacity="0.45"/>
    </g></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(340 72% 50%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(190 52% 26%)">Happy Birthday</text>
</svg>
