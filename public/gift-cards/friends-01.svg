<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Just because gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(190 58% 34%)"/>
      <stop offset="100%" stop-color="hsl(158 62% 20%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><circle cx="99" cy="150" r="37" fill="hsl(226 92% 68%)" opacity="0.42"/><circle cx="184" cy="122" r="30" fill="hsl(10 70% 70%)" opacity="0.42"/><circle cx="247" cy="136" r="42" fill="hsl(226 92% 68%)" opacity="0.42"/><circle cx="334" cy="160" r="41" fill="hsl(10 70% 70%)" opacity="0.42"/><circle cx="404" cy="161" r="52" fill="hsl(226 92% 68%)" opacity="0.42"/><circle cx="475" cy="136" r="48" fill="hsl(10 70% 70%)" opacity="0.42"/><circle cx="557" cy="158" r="51" fill="hsl(226 92% 68%)" opacity="0.42"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(0,0,0,0.34)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(226 92% 68%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(0 0% 100%)">Just because</text>
</svg>
