<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Happy Retirement gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(20 46% 16%)"/>
      <stop offset="100%" stop-color="hsl(48 54% 30%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><circle cx="320" cy="176" r="62" fill="hsl(64 94% 70%)" opacity="0.9"/><rect x="99" y="202" width="376" height="5" rx="3" fill="hsl(20 74% 66%)" opacity="0.50"/><rect x="124" y="218" width="414" height="5" rx="3" fill="hsl(20 74% 66%)" opacity="0.43"/><rect x="110" y="234" width="366" height="5" rx="3" fill="hsl(20 74% 66%)" opacity="0.36"/><rect x="95" y="250" width="348" height="5" rx="3" fill="hsl(20 74% 66%)" opacity="0.29"/><rect x="104" y="266" width="344" height="5" rx="3" fill="hsl(20 74% 66%)" opacity="0.22"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(0,0,0,0.34)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(64 94% 70%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="hsl(0 0% 100%)">Happy Retirement</text>
</svg>
