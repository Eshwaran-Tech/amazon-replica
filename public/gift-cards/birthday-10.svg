      <ellipse cx="50" cy="134" rx="8" ry="10" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M175 180 q 1 60 -3 110" fill="none" stroke="hsl(340 62% 24%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="175" cy="158" rx="22" ry="26" fill="hsl(170 62% 46%)"/>
      <ellipse cx="169" cy="151" rx="5" ry="7" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M258 125 q -1 60 1 110" fill="none" stroke="hsl(340 62% 24%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="258" cy="100" rx="24" ry="29" fill="hsl(340 74% 52%)"/>
      <ellipse cx="251" cy="92" rx="6" ry="7" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M360 172 q -4 60 -3 110" fill="none" stroke="hsl(340 62% 24%)" stroke-opacity="0.35" stroke-width="2"/>
