      <ellipse cx="350" cy="131" rx="7" ry="9" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M462 138 q -5 60 1 110" fill="none" stroke="hsl(340 62% 24%)" stroke-opacity="0.35" stroke-width="2"/>
      <ellipse cx="462" cy="105" rx="33" ry="39" fill="hsl(340 74% 52%)"/>
      <ellipse cx="453" cy="94" rx="8" ry="10" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M541 116 q -2 60 -4 110" fill="none" stroke="hsl(340 62% 24%)" stroke-opacity="0.35" stroke-width="2"/>
