<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Merry Christmas gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(150 82% 92%)"/>
      <stop offset="100%" stop-color="hsl(178 76% 82%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><path d="M320 92 L364 146 L276 146 Z" fill="hsl(150 74% 52%)"/><path d="M320 134 L398 188 L242 188 Z" fill="hsl(150 74% 52%)"/><path d="M320 176 L432 230 L208 230 Z" fill="hsl(150 74% 52%)"/><circle cx="368" cy="135" r="5" fill="hsl(340 62% 46%)"/><circle cx="296" cy="171" r="5" fill="hsl(340 62% 46%)"/><circle cx="326" cy="166" r="5" fill="hsl(340 62% 46%)"/><circle cx="324" cy="149" r="5" fill="hsl(340 62% 46%)"/><circle cx="335" cy="198" r="5" fill="hsl(340 62% 46%)"/><circle cx="338" cy="191" r="5" fill="hsl(340 62% 46%)"/><circle cx="264" cy="213" r="5" fill="hsl(340 62% 46%)"/><circle cx="367" cy="137" r="5" fill="hsl(340 62% 46%)"/><circle cx="298" cy="178" r="5" fill="hsl(340 62% 46%)"/><rect x="308" y="212" width="24" height="30" rx="4" fill="hsl(150 62% 24%)" opacity="0.7"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(150 74% 52%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(150 62% 24%)">Merry Christmas</text>
</svg>
