<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Congratulations gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(28 46% 16%)"/>
      <stop offset="100%" stop-color="hsl(56 54% 30%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><g fill="none" stroke-width="9">
    <circle cx="286" cy="132" r="42" stroke="hsl(72 94% 70%)"/>
    <circle cx="354" cy="132" r="42" stroke="hsl(28 74% 66%)"/>
  </g>
  <circle cx="286" cy="90" r="7" fill="hsl(72 94% 70%)"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(0,0,0,0.34)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(72 94% 70%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(0 0% 100%)">Congratulations</text>
</svg>
