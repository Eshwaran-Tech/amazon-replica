<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Welcome, little one gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(45 82% 92%)"/>
      <stop offset="100%" stop-color="hsl(73 76% 82%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><circle cx="320" cy="122" r="46" fill="hsl(45 74% 52%)"/>
  <circle cx="320" cy="122" r="26" fill="#ffffff" opacity="0.55"/>
  <rect x="311" y="164" width="18" height="62" rx="9" fill="hsl(235 62% 46%)"/>
  <circle cx="258" cy="96" r="13" fill="hsl(235 62% 46%)"/>
  <circle cx="384" cy="108" r="10" fill="hsl(235 62% 46%)"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(45 74% 52%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="hsl(45 62% 24%)">Welcome, little one</text>
</svg>
