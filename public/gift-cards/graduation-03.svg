<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="You did it gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(65 62% 88%)"/>
      <stop offset="100%" stop-color="hsl(225 70% 84%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><path d="M228 122 L320 78 L412 122 L320 166 Z" fill="hsl(225 72% 50%)"/>
  <path d="M274 144 L274 184 Q 320 212 366 184 L366 144" fill="hsl(75 62% 48%)"/>
  <path d="M408 124 L408 196" stroke="hsl(75 62% 48%)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="408" cy="202" r="10" fill="hsl(75 62% 48%)"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(225 72% 50%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(75 52% 26%)">You did it</text>
</svg>
