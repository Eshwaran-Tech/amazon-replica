      <ellipse cx="155" cy="129" rx="6" ry="8" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M266 162 q 5 60 -2 110" fill="none" stroke="hsl(340 62% 24%)" stroke-opacity="0.35" stroke-width="2"/>
