  <path d="M274 82 h-26 a26 26 0 0 0 26 26 Z" fill="hsl(48 62% 48%)"/>
  <path d="M366 82 h26 a26 26 0 0 1 -26 26 Z" fill="hsl(48 62% 48%)"/>
  <rect x="310" y="158" width="20" height="34" fill="hsl(48 62% 48%)"/>
  <rect x="276" y="192" width="88" height="18" rx="5" fill="hsl(198 72% 50%)"/>
  <polygon points="320.0,96.0 325.2,108.9 339.0,109.8 328.4,118.7 331.8,132.2 320.0,124.8 308.2,132.2 311.6,118.7 301.0,109.8 314.8,108.9" fill="#ffffff" opacity="0.75"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(198 72% 50%)"/>
