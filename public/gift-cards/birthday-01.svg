      <ellipse cx="459" cy="120" rx="31" ry="38" fill="hsl(16 92% 68%)"/>
      <ellipse cx="449" cy="109" rx="8" ry="9" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
