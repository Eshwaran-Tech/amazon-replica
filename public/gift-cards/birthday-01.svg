      <ellipse cx="164" cy="74" rx="6" ry="7" fill="#ffffff" opacity="0.45"/>
    </g><g opacity="0.9">
      <path d="M254 177 q 4 60 -2 110" fill="none" stroke="hsl(0 0% 100%)" stroke-opacity="0.35" stroke-width="2"/>
