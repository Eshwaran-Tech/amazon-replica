<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Happy Dussehra gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(15 82% 92%)"/>
      <stop offset="100%" stop-color="hsl(43 76% 82%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><path d="M260 62 q -46 74 0 148" fill="none" stroke="hsl(15 74% 52%)" stroke-width="10" stroke-linecap="round"/>
  <path d="M260 62 L260 210" stroke="hsl(205 62% 46%)" stroke-width="4"/>
  <path d="M268 136 L404 136" stroke="hsl(205 62% 46%)" stroke-width="7" stroke-linecap="round"/>
  <path d="M404 136 l -22 -12 l 0 24 Z" fill="hsl(205 62% 46%)"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(15 74% 52%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="hsl(15 62% 24%)">Happy Dussehra</text>
</svg>
