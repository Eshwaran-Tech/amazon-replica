<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Happy Work Anniversary gift card design">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(175 82% 92%)"/>
      <stop offset="100%" stop-color="hsl(203 76% 82%)"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#wash)"/>
  <!-- The motifs are drawn around (320, 140); scaling about that point fills the
       face above the band instead of leaving a dead strip across the middle.
       A uniform scale, so nothing that should be round comes out oval. -->
  <g transform="translate(320 148) scale(1.26) translate(-320 -148)"><path d="M290 170 L276 254 L320 226 L364 254 L350 170 Z" fill="hsl(5 62% 46%)"/>
  <circle cx="320" cy="126" r="58" fill="hsl(175 74% 52%)"/>
  <circle cx="320" cy="126" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
  <polygon points="320.0,102.0 326.2,117.5 342.8,118.6 330.0,129.3 334.1,145.4 320.0,136.6 305.9,145.4 310.0,129.3 297.2,118.6 313.8,117.5" fill="#ffffff" opacity="0.85"/></g>

  <rect x="0" y="304" width="640" height="96" fill="rgba(255,255,255,0.78)"/>
  <rect x="0" y="304" width="640" height="3" fill="hsl(175 74% 52%)"/>
  <text x="320" y="364" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="hsl(175 62% 24%)">Happy Work Anniversary</text>
</svg>
